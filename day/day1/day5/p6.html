<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flexbox | Display | flex-direction | justify-content </title>
    <style>
        .container{
            display: flex;
            border: 2px solid blue;
            gap: 10px;
            padding: 10px;
            flex-direction: row;
        }
        .item{
            background-color: burlywood;
            color:darkred;
            padding: 15px;
            
        }
        .container2{
            display: flex;
            border: 2px solid brown;
            gap: 10px;
            padding: 10px;
            /* column | row | row-reverse | column-reverse */
            flex-direction: row-reverse;
            margin-top: 10px;
        }
        .container3{
            display: flex;
            border: 2px solid orange;
            gap: 10px;
            padding: 10px;
            /* center | space-around | space-between */
            justify-content: space-around;
            margin-top: 10px;
        }
        .item3{
            background-color: chartreuse;
            color:darkred;
            padding: 15px;
        }
    </style>
</head>
<body>
    <p>CSS Flexbox:is a one-dimentional layout system designed to arrange and align items
        in a container, either in a row or a column. It makes much easier to create responsive, flexible layouts without complex positioning or floats.
    </p>
    <div class="container">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
    </div>
    <!-- flex-direction -->
    <div class="container2">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
    </div>
    <!-- justify-content -->
    <div class="container3">
        <div class="item3">Item 1</div>
        <div class="item3">Item 2</div>
        <div class="item3">Item 3</div>
    </div>
</body>
</html>
