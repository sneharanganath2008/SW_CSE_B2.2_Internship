<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Tag</title>
</head>
<body>
    <p>Video Tag example</p>
    <video src="../video/samplevideo.mp4" controls type="video/mp4"></video>

    <!-- width & height -->
     <video src="../video/sample-5s-360p.mp4" controls type="video/mp4" width="640" height="360"></video>

    <!-- autoplay -->
     <video src="samplevideo.mp4" controls type="video/mp4" autoplay></video>

    <!-- muted -->
    <video src="../video/sample-5s-360p.mp4" controls type="video/mp4" autoplay muted width="640" height="360"></video>

    <!--loop-->
    <video src="../video/sample-5s-360p.mp4" controls loop autoplay muted width="640" height="360" loop></video>

    <!--poster-->
    <video src="samplevideo.mp4" controls type="video/mp4" poster="../images/dog.jpg"></video>
    
</body>
</html>
