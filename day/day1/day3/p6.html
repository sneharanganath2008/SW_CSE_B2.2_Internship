<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table 5</title>
</head>
<body>
    <!-- Spanning rows and Columns -->
     <h4>colspan</h4>
     <table border="2">
        <tr>
            <th colspan="3">student details</th>
        </tr>
        <tr>
            <td colspan="2">Name</td>
            <td>sneha</td>
        </tr>
        <tr>
            
        </tr>
        <tr>
            <td>courses</td>
            <td>Full stack</td>
            <td>Gen AI</td>
        </tr>
     </table>
     <hr>
     <h4> rowspan</h4>

     <!-- row span -->
      <table border="2">
        <tr>
          <th rowspan="2">day</th> 
          <th>Morning</th>
          <th>Evening</th>
          
        </tr>
        <tr>
          <td>ReactsJS Practice</td>
          <td>Backend Practice</td>
        </tr>
      </table>
</body>
</html>
