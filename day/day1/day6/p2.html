<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>box model</title>
    <style>
        .box{
            width: 200px;
            height: 100px;
            background-color: blueviolet;
            padding:  30px 20px; /* top - right - bottom - left */
            padding: 20px; /* shorthand representation */
          /* padding-left: 50px; */
          /* border */
          border: 2px solid blue; /* shorthand representaion */
          /* line display style: solid/dashed/dotted */
          border-top: 1px dashed red;
          /* margin */
          margin: 20px;
          /* margin individual */
          margin-top: 10px;
          margin-right: 100px;
          margin-left:50px;

        }
    </style>
</head>
<body>
    <div class="box"> 
        content text is being renderd here as an example for box model.
