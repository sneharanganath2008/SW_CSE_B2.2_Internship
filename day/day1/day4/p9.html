<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors | class selector </title>
    <style>
        .style1{
            font-size: 18px;
            background-color: cadetblue;
            color:aqua;
        }
        .style2{
            color:brown;
            
        }
        .style3{
            font-family: 'courier new', 'Courier', monospace;
            font-weight: bold;
        }
        
    </style>
</head>
<body>
    <h1 class="style1">Class selector </h1>
    <h1 class="style2">heading tag itself;but a different style</h1>
    <p class="style3">This is a new paragraph that I've created.</p> 
    <p class="style2">this is the second paragraph.</p>

</body>
</html>
